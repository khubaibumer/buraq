name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOXYGEN_VERSION: 1.15.0

jobs:
  build:
    name: Build API Reference (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }} & Graphviz
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          TAG="Release_${DOXYGEN_VERSION//./_}"
          curl -fsSL "https://github.com/doxygen/doxygen/releases/download/${TAG}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
            | tar -xz -C "${{ runner.temp }}"
          echo "${{ runner.temp }}/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate docs (warnings are errors)
        run: |
          doxygen --version
          cmake -B build -DBURAQ_BUILD_DOCS=ON -DBURAQ_DOCS_WARN_AS_ERROR=ON \
                -DBURAQ_BUILD_EXAMPLES=OFF -DBURAQ_BUILD_TESTS=OFF
          cmake --build build --target buraq_docs || { cat build/docs/doxygen-warnings.log; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
