name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:


permissions:
  contents: read

jobs:
  cpp-matrix:
    name: ${{ matrix.name }} (C++${{ matrix.std }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            std: 20
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            std: 23
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            std: 20
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            std: 23
          - name: macOS AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++
            std: 20
          - name: Windows MSVC
            os: windows-latest
            cc: cl
            cxx: cl
            std: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DBURAQ_BUILD_EXAMPLES=ON
          -DBURAQ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CTest suite
        run: ctest --test-dir build -C Release --output-on-failure

  single-header:
    name: Single-Header Amalgamation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify single_include/ is up to date
        run: python3 scripts/amalgamate.py --check

      - name: Compile zero-dependency single header standalone
        run: |
          printf '#include <buraq/acp.hpp>\nint main() { return 0; }\n' > sh.cpp
          for std in 20 23; do
            g++ -std=c++${std} -Wall -Wextra -Wpedantic -Werror -Isingle_include sh.cpp -o sh
          done

  sdk-compliance:
    name: Official @agentclientprotocol/sdk Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure & Build Echo Agent
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DBURAQ_BUILD_EXAMPLES=ON \
            -DBURAQ_BUILD_TESTS=OFF
          cmake --build build --target buraq_echo_agent --parallel

      - name: Run Official TS SDK Verification
        run: |
          npm install --no-save @agentclientprotocol/sdk
          node scripts/verify_sdk.mjs ./build/buraq_echo_agent

  coverage:
    name: Code Coverage (GCC, gcovr)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install "gcovr>=8.3"

      - name: Configure (instrumented Debug build)
        run: >
          cmake -B build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=23
          -DBURAQ_BUILD_EXAMPLES=ON
          -DBURAQ_BUILD_TESTS=ON
          -DBURAQ_ENABLE_COVERAGE=ON
          -DBURAQ_COVERAGE_FAIL_UNDER_LINE=90

      - name: Build
        run: cmake --build build-cov --parallel

      - name: Run tests and collect coverage
        run: cmake --build build-cov --target buraq_coverage

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f build-cov/coverage/summary.md ]; then
            cat build-cov/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-cov/coverage/

  acp-tck:
    name: Official ACP Conformance Test Kit (TCK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Configure & Build Echo Agent
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DBURAQ_BUILD_EXAMPLES=ON \
            -DBURAQ_BUILD_TESTS=OFF
          cmake --build build --target buraq_echo_agent --parallel

      # The TCK exits non-zero on ADVISORY failures (e.g. the echo example does not launch MCP servers),
      # so gate the job on the MANDATORY verdict from the JSON report instead.
      - name: Run acp-tck against the echo agent
        run: |
          mkdir -p tck-wd
          uvx --from git+https://github.com/agentclientprotocol/acp-tck@v0.4.0 acp-tck \
            --agent-cwd tck-wd --timeout 10 --report-json tck-report.json \
            -- "$PWD/build/buraq_echo_agent" || true
          python3 - << 'EOF'
          import json, sys
          verdict = json.load(open("tck-report.json"))["verdict"]
          print(json.dumps(verdict, indent=2))
          mandatory = verdict["tier_counts"]["MANDATORY"]
          sys.exit(0 if verdict["conformant"] and mandatory["FAIL"] == 0 else 1)
          EOF

      - name: Upload TCK report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-tck-report
          path: tck-report.json

  package-verify:
    name: CMake Install & Consumer find_package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install buraq to staging prefix
        run: |
          cmake -B build -DBURAQ_BUILD_EXAMPLES=OFF -DBURAQ_BUILD_TESTS=OFF -DBURAQ_INSTALL=ON
          cmake --install build --prefix "${{ runner.temp }}/buraq-install"

      - name: Verify downstream find_package(buraq) consumer
        run: |
          mkdir -p "${{ runner.temp }}/consumer"
          cat << 'EOF' > "${{ runner.temp }}/consumer/CMakeLists.txt"
          cmake_minimum_required(VERSION 3.23)
          project(buraq_consumer LANGUAGES CXX)
          find_package(buraq CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE buraq::buraq)
          EOF

          cat << 'EOF' > "${{ runner.temp }}/consumer/main.cpp"
          #include <buraq/acp.hpp>
          int main() { return 0; }
          EOF

          cmake -S "${{ runner.temp }}/consumer" \
                -B "${{ runner.temp }}/consumer/build" \
                -DCMAKE_PREFIX_PATH="${{ runner.temp }}/buraq-install"
          cmake --build "${{ runner.temp }}/consumer/build"
